name: Bootstrap TIBOX packages

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-packages.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until all package parts are ready
        id: ready
        shell: bash
        run: |
          if [[ -f .bootstrap/READY ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and extract packages
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/core-*.b64 > /tmp/tibox-core.zip.b64
          cat .bootstrap/theme-*.b64 > /tmp/tibox-theme.zip.b64
          base64 -d /tmp/tibox-core.zip.b64 > /tmp/tibox-core.zip
          base64 -d /tmp/tibox-theme.zip.b64 > /tmp/tibox-theme.zip
          unzip -t /tmp/tibox-core.zip
          unzip -t /tmp/tibox-theme.zip
          rm -rf tibox-core tibox-theme
          unzip -q /tmp/tibox-core.zip -d /tmp/core-expanded
          unzip -q /tmp/tibox-theme.zip -d /tmp/theme-expanded
          cp -a /tmp/core-expanded/tibox-core ./tibox-core
          cp -a /tmp/theme-expanded/tibox-theme ./tibox-theme
          rm -rf .bootstrap

      - name: Commit extracted source
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add TIBOX Core 0.4 and Theme 0.6 source [skip ci]"
          git push
